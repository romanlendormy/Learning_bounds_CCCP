# config_default.yaml — Configuration du générateur SSP chance-constrained
# Toutes les plages sont [min, max] inclus (entiers ou flottants selon le paramètre).

# ── Taille des épisodes ───────────────────────────────────────────────────────
n_episodes: 100          # nombre total d'épisodes dans le dataset
T: 16                    # horizon (périodes)
N: 50                    # scénarios in-sample (SAA)
K_oos: 2000              # scénarios out-of-sample (validation)
epsilon: 0.1             # niveau de risque (chance constraint : couvrir (1-ε)·N scénarios)
tightness_target: 1.1    # ratio cible capacité/demande-pic (E = ceil(Q_peak * tightness))

# ── Demande stochastique ──────────────────────────────────────────────────────
rho_range: [0.3, 0.8]         # autocorrélation AR(1) ρ ∈ [0,1)
sigma_dem_range: [0.1, 0.3]   # écart-type log-normal σ

# ── Automate ──────────────────────────────────────────────────────────────────
L_min_range: [4, 6]           # longueur min du service
L_max_range: [6, 10]          # longueur max du service
m_choices: [2, 3, 4]          # max W consécutifs
n_P_choices: [0, 1, 2]        # nombre exact de pauses P
meal_len_choices: [1, 2]      # durée du repas (symboles R)
a_min_range: [1, 3]           # min W avant repas

# ── Coûts salariaux ───────────────────────────────────────────────────────────
b0_range: [1.0, 2.0]          # coût de base
b_soir_range: [0.2, 0.8]      # prime de soirée
b_nuit_range: [0.5, 1.5]      # prime de nuit

# ── Reproductibilité ──────────────────────────────────────────────────────────
master_seed: 42               # graine maître (toutes les graines dérivent de celle-ci)
max_automaton_retries: 20     # max essais si le DFA est vide pour le T donné
